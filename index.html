  <style>
    :root{--ink:#f8f3ff;--muted:#ada4be;--panel:#20172f;--panel2:#2a1d3d;--line:#49395e;--red:#f45b50;--gold:#ffd36a;--mint:#78e6bd;--cyan:#6dd9ee;--danger:#ff7986;--shadow:0 14px 38px #05030888}

    .menu{display:grid;gap:10px;margin-top:26px}.btn{min-height:52px;border:1px solid var(--line);background:linear-gradient(180deg,#302143,#241832);border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #110b19;transition:.12s transform,.12s filter}.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #110b19}.btn.primary{background:linear-gradient(180deg,#ff6b59,#c93649);border-color:#ff9c81}.btn.gold{background:linear-gradient(180deg,#f5c654,#bd7729);color:#211408;border-color:#ffe292}.btn.ghost{background:#171020}.btn:disabled{opacity:.42;filter:grayscale(.4);cursor:not-allowed}

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar .place{display:grid;gap:2px}.topbar small{color:var(--gold);font-weight:800}.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#241832;cursor:pointer}
    .objective{border-left:4px solid var(--gold);padding:11px 13px;background:#21182b;border-radius:0 12px 12px 0;font-size:.88rem}.objective b{color:var(--gold)}
    .map{position:relative;flex:1;min-height:430px;border:1px solid #50375d;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 70% 26%,#49674788 0 8%,transparent 9%),radial-gradient(circle at 22% 68%,#495c4788 0 11%,transparent 12%),linear-gradient(145deg,#1f3540,#142633 45%,#25263c);box-shadow:inset 0 0 65px #05040a88}
    .map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(30deg,transparent 48%,#ffffff08 49% 51%,transparent 52%);background-size:38px 38px}

    .node{position:absolute;width:90px;border:0;background:transparent;color:white;display:grid;justify-items:center;gap:7px;cursor:pointer}.node .mark{width:58px;height:58px;border-radius:18px;background:#251832;border:2px solid #8e6aa5;display:grid;place-items:center;font-size:1.6rem;box-shadow:0 8px 20px #0009}.node span:last-child{font-weight:900;font-size:.82rem;text-shadow:0 2px 5px #000}.node.active .mark{border-color:var(--gold);box-shadow:0 0 0 5px #ffd36a22,0 8px 22px #000}.node.active:after{content:"目的地";position:absolute;top:-20px;color:var(--gold);font-size:.7rem;font-weight:900}.node.locked{opacity:.32}.n1{left:7%;bottom:11%}.n2{left:44%;top:35%}.n3{right:4%;top:17%}
    .party-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{padding:9px;background:#1f162b;border:1px solid #413252;border-radius:11px;font-size:.74rem}.mini b{display:block;font-size:.82rem;margin-bottom:5px}.bar{height:6px;background:#0c0811;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint)}.bar.mp i{background:var(--cyan)}
    .dungeon{background:radial-gradient(circle at 50% 12%,#4b303d,transparent 28%),linear-gradient(#17121f,#0b0910)}.room{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex:1;align-content:center}.tile{aspect-ratio:1;border:1px solid #473947;background:linear-gradient(145deg,#27222b,#151119);border-radius:9px;display:grid;place-items:center;position:relative}.tile.path:after{content:"";width:38%;height:38%;border-radius:50%;background:#6b596b55}.tile.wall{background:repeating-linear-gradient(135deg,#17131b 0 8px,#29212d 8px 16px);border-color:#332938;box-shadow:inset 0 0 12px #000}.tile.wall:after{content:"";width:70%;height:70%;border:2px solid #4b3e4e;border-radius:5px}.tile.player{background:#37213a;border-color:#ee665d;z-index:2}.tile.player:after{content:"";position:absolute;width:92%;height:125%;left:4%;bottom:2%;border-radius:0;background:url('assets/protagonist-dungeon.webp') center bottom/contain no-repeat;filter:drop-shadow(0 4px 3px #000)}.tile.enemy:after{content:"☠";font-size:1.45rem;color:#f6b259}.tile.boss{border-color:#ff6e68;box-shadow:0 0 12px #f45b5088}.tile.boss:after{content:"♜";font-size:1.55rem;color:#ff8d69}.tile.chest:after{content:"◆";font-size:1.35rem;color:var(--gold)}.tile.exit:after{content:"門";font-weight:900;color:var(--mint)}
    .dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:7px;justify-content:center}.dpad .btn{min-height:0;padding:0}.dpad [data-dir="up"]{grid-column:2}.dpad [data-dir="left"]{grid-row:2;grid-column:1}.dpad [data-dir="down"]{grid-row:2;grid-column:2}.dpad [data-dir="right"]{grid-row:2;grid-column:3}

    .enemy-hp{height:7px;background:#120b15;border:1px solid #584151;border-radius:8px;overflow:hidden;margin-top:8px}.enemy-hp i{display:block;height:100%;background:var(--danger);transition:.3s width}.enemy-name{font-size:.82rem;font-weight:900}

    .combatants{display:grid;gap:7px}.ally{display:grid;grid-template-columns:1fr 88px;gap:10px;align-items:center;border:1px solid #443650;background:#21172d;border-radius:11px;padding:9px 11px}.ally.active{border-color:var(--gold);box-shadow:0 0 0 2px #ffd36a22}.ally small{color:var(--muted)}.stats{display:grid;gap:5px;font-size:.71rem}.hp-line{display:flex;justify-content:space-between}

    .modal{position:absolute;inset:0;z-index:30;background:#08050dcc;backdrop-filter:blur(8px);padding:20px;display:grid;place-items:center}.modalbox{width:100%;max-width:470px;max-height:85dvh;overflow:auto;background:#21162f;border:1px solid #614875;border-radius:18px;padding:18px;box-shadow:0 24px 80px #000}.modalbox h2{margin-bottom:12px}.choice-list{display:grid;gap:9px}.spell{display:flex;justify-content:space-between;align-items:center;text-align:left}.spell small{display:block;color:var(--muted);margin-top:3px}.target-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .toast{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;padding:13px 16px;border-radius:12px;background:#f4e4bb;color:#2b1a19;font-weight:900;box-shadow:0 14px 40px #000;animation:pop .25s}@keyframes pop{from{transform:translateY(18px);opacity:0}}
    .result{justify-content:center}.loot{display:grid;gap:9px;margin:18px 0}.gain{display:flex;justify-content:space-between;padding:11px;background:#171020;border-radius:10px}.levelup{color:var(--gold);font-weight:900}.save-slots{display:grid;gap:10px}.slot{text-align:left}.slot small{display:block;color:var(--muted);margin-top:4px}.shopgrid{display:grid;gap:9px}.shopitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.shopitem small{display:block;color:var(--muted);margin-top:4px}.shopitem .btn{min-height:42px;box-shadow:none}
    .room{grid-template-columns:repeat(7,1fr);gap:4px;padding:8px;border:1px solid #4c3a57;border-radius:14px;background:#08060dcc;box-shadow:inset 0 0 30px #000}.tile{border-radius:6px;overflow:hidden}.tile.path:before{content:"";position:absolute;inset:8%;border:1px solid #ffffff0d;border-radius:4px}.tile.wall:before{content:"";position:absolute;inset:7%;background:linear-gradient(90deg,transparent 46%,#0005 47% 53%,transparent 54%),linear-gradient(#ffffff0b 46%,#0006 47% 54%,transparent 55%);background-size:18px 13px}.zone-waterway .tile.path{background:linear-gradient(145deg,#26333b,#111c24);border-color:#345363}.zone-waterway .tile.path:before{background:linear-gradient(90deg,transparent 28%,#287b8c66 30% 70%,transparent 72%);box-shadow:inset 0 0 8px #54d8e444}.zone-waterway .tile.wall{background:repeating-linear-gradient(135deg,#182229 0 8px,#303b40 8px 16px)}.zone-sealed .tile.path{background:radial-gradient(circle,#5d3e7066 0 13%,transparent 15%),linear-gradient(145deg,#30243a,#17121e);border-color:#664c75}.zone-sealed .tile.wall{background:repeating-linear-gradient(45deg,#211927 0 7px,#3a2a42 7px 14px)}.zone-corridor .tile.path{background:linear-gradient(145deg,#293127,#121b15);border-color:#4b6348}.zone-corridor .tile.path:before{background:linear-gradient(45deg,transparent 42%,#79905b33 43% 57%,transparent 58%)}.zone-corridor .tile.wall{background:repeating-linear-gradient(90deg,#20261d 0 9px,#394032 9px 18px);filter:saturate(.7)}.tile.boss{animation:bossPulse 1.7s ease-in-out infinite}@keyframes bossPulse{50%{box-shadow:0 0 18px #ff5a55cc}}
    .map{min-height:650px;background-image:linear-gradient(#09111a22,#09111a55),url('assets/world-map-v2.png');background-size:cover;background-position:center;box-shadow:inset 0 0 55px #05040aaa}.map:before{background:none}
    @media (min-width:700px){#app{min-height:900px}.screen{min-height:900px}.title-screen{padding:54px}.map{min-height:720px}}
    @media (max-height:720px){.enemy-stage{min-height:150px}.enemy-art{font-size:3.4rem}.screen{gap:9px;padding-top:12px}.map{min-height:350px}.btn{min-height:46px}}

<body><main id="app" aria-live="polite"></main>
<script>
(() => {
  const app=document.querySelector('#app');
  const KEY='isekai-prototype-save-v1';
  const max=(a,b)=>Math.max(a,b), clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rollNeed=()=>3+Math.floor(Math.random()*5);
  const baseState=()=>({name:'ノクス',screen:'map',chapter:1,location:'王都城下町',objective:'城下町で旅支度を整え、古い水路へ向かう',unlocked:2,gold:100,potions:3,battles:0,vitalAt:rollNeed(),townVisited:false,healJoined:false,weapons:{'剣':1,'杖':1,'弓':0,'槍':0},stones:{'烈風刃':1,'ヘイスト':1,'プロテクト':1},dungeon:{zone:'waterway',pos:42,enemies:[8,15,18,20,29,34,38,41,6],respawns:{},chest:true,boss:false,layoutVersion:2},party:[
    {id:'hero',name:'ノクス',role:'軽装剣士',hp:64,maxHp:64,mp:18,maxMp:18,atk:10,def:7,mag:7,spd:8,statUse:{atk:0,def:0,mag:0},statNeed:{atk:rollNeed(),def:rollNeed(),mag:rollNeed()},weapon:'剣',weaponLv:1,weaponUse:0,fireLv:1,fireUse:0,healLv:1,healUse:0,row:'front',stones:[],aptitudes:{fire:1,water:1,wind:1,earth:1},guard:false},
    {id:'wind',name:'リュネ',role:'風使い',hp:48,maxHp:48,mp:28,maxMp:28,atk:6,def:5,mag:12,spd:12,statUse:{atk:0,def:0,mag:0},statNeed:{atk:rollNeed(),def:rollNeed(),mag:rollNeed()},weapon:'杖',weaponLv:1,weaponUse:0,windLv:1,windUse:0,row:'back',stones:[],aptitudes:{wind:2},guard:false}
  ],flags:{lv13:false,tutorial:false}});
  let S=null, battle=null, modal=null, toastTimer=null;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const saves=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[null,null,null]}catch{return [null,null,null]}};
  function save(slot=0){const all=saves();all[slot]={state:S,at:Date.now()};localStorage.setItem(KEY,JSON.stringify(all));}
  function autosave(){if(S){save(0);showToast('オートセーブしました')}}
  function showToast(msg){clearTimeout(toastTimer);const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;app.append(t);toastTimer=setTimeout(()=>t.remove(),1900)}
  function title(){modal=null;app.innerHTML=`<section class="screen title-screen"><div class="sigil"><span>◆</span></div><div class="eyebrow">COMMAND RPG PROTOTYPE</div><div class="title-copy"><h1>異世界召喚されたけど<br>勇者パーティには<br>選ばれませんでした</h1><p>帰る方法は、自分たちで探す。<br>使った剣と魔法だけが強くなる、小さな旅。</p></div><div class="menu"><button class="btn primary" data-act="new">はじめから</button><button class="btn" data-act="continue" ${saves()[0]?'':'disabled'}>つづきから</button><button class="btn ghost" data-act="slots">セーブデータ</button></div><div class="title-foot"><span>タップ／マウス対応</span><span>PROLOGUE BUILD</span></div></section>`;}
  function newSetup(){app.innerHTML=`<section class="screen setup"><button class="iconbtn" data-act="title" aria-label="戻る">←</button><div class="eyebrow">SUMMONED NAME</div><h1>異世界で名乗る<br>魔王名を決める</h1><p class="muted">本名は伏せて、ハロウィン衣装の役名を使うことにした。</p><div class="field"><label for="heroName">主人公の名前</label><input id="heroName" maxlength="8" value="ノクス" autocomplete="off"></div><button class="btn primary" data-act="start">旅を始める</button></section>`;setTimeout(()=>document.querySelector('#heroName')?.focus(),100)}
  function prologueScenes(){return [
    {place:'現代日本・コンセプトカフェ',who:'店長',face:'manager',text:'おーい魔王さま、勇者ちゃん。写真待ちのお客さん詰まっとるで。世界征服は休憩後にしてやー。'},
    {place:'ハロウィンイベント',who:S.name,face:'hero',text:'俺はバイトです。世界征服は業務に入ってません。'},
    {place:'ハロウィンイベント',who:'リュネ',face:'wind',text:'じゃあ私は勇者だけど、魔王を倒さずドリンク運んでくるね。平和でいいでしょ。'},
    {place:'店内',who:'店長',face:'manager',text:'その温度差、うちの名物にできそうやな。ほな二人とも、ラスト一時間よろしく！'},
    {place:'店内の奥',who:'語り',face:'narrator',text:'眼鏡の会社員は剣士衣装の袖を直し、ヴァンパイア姿のギャルは派手な髪で強面の神官へ自撮りを頼んでいる。彼は怖そうな雰囲気に反して、驚くほど丁寧にスマホを構えた。'},
    {place:'カフェカウンター',who:'語り',face:'narrator',text:'その近くでは、魔術師姿の客、軽戦士姿の客、槍兵姿の客もイベントを楽しんでいた。まだ、この九人が同じ場所へ召喚されるとは誰も知らない。'},
    {place:'店内の奥',who:'ヴァンパイアギャル',face:'vampire',text:'神官さん、盛れる角度でお願い！　あ、メガネ剣士も入る？'},
    {place:'店内の奥',who:'眼鏡の会社員',face:'salary',text:'私は結構です。……それより、床の模様。さっきから光っていませんか。'},
    {place:'異変',who:'強面の神官',face:'healer',text:'皆さん、足元から離れてください。店長さん、ブレーカーを——'},
    {place:'召喚の光',who:'語り',face:'narrator',tone:'summon',text:'言葉が終わるより早く、青白い光が店内を飲み込んだ。音も重さも消え、次の瞬間、石造りの広間へ叩き出される。'},
    {place:'異世界・王城',who:'王国の鑑定士',face:'narrator',tone:'castle',text:'召喚に巻き込まれた皆さまへ、まずお詫びを。魔王討伐に適する力を持つ方には、帰還研究への全面協力を約束します。'},

  function prologueScreen(){S.screen='prologue';S.prologue=S.prologue||0;save(0);const scenes=prologueScenes(),x=scenes[S.prologue]||scenes[0];app.innerHTML=`<section class="screen story-screen"><div class="story-art ${x.tone||''}"><div class="story-top"><span>PROLOGUE · ${esc(x.place)}</span><button class="btn ghost skip" data-act="skipprologue">スキップ</button></div></div><div class="dialogue"><div class="speaker"><div class="portrait ${x.face}"></div><span>${esc(x.who)}</span></div><p>${esc(x.text)}</p><button class="btn primary next" data-act="nextstory">${S.prologue===scenes.length-1?'城下町へ':'次へ'}</button></div></section>`}
  function finishPrologue(){delete S.prologue;S.screen='town';save(0);townScreen();showToast('冒険をオートセーブしました')}
  function partyStrip(){return `<div class="party-strip">${S.party.map(p=>`<div class="mini"><b>${esc(p.name)}</b><div class="bar"><i style="width:${100*p.hp/p.maxHp}%"></i></div><span>HP ${p.hp}/${p.maxHp}</span></div>`).join('')}<div class="mini"><b>所持金</b><span>${S.gold} G</span><br><span>薬 ${S.potions}</span></div></div>`}
  const stoneDefs={'烈風刃':{element:'wind',tier:2,label:'風・中級'},'ヘイスト':{element:'wind',tier:1,label:'風・初級'},'プロテクト':{element:'earth',tier:1,label:'土・初級'}};
  function canEquipStone(p,stone){const d=stoneDefs[stone];return !!d&&(p.aptitudes?.[d.element]||0)>=d.tier}
  function normalizeState(){S.weapons=S.weapons||{'剣':1,'杖':1,'弓':0,'槍':0};for(const k of ['剣','杖','弓','槍']){if(typeof S.weapons[k]==='boolean')S.weapons[k]=S.weapons[k]?1:0;S.weapons[k]=Number(S.weapons[k]||0)}S.stones=S.stones||{'烈風刃':1,'ヘイスト':1,'プロテクト':1};S.flags=S.flags||{};if((S.objective||'').includes('門')&&(S.objective||'').includes('届ける'))S.flags.gateFragment=true;if(S.dungeon?.zone!=='sealed'&&S.dungeon?.enemies?.includes(18))S.dungeon.enemies=S.dungeon.enemies.map(x=>x===18?9:x);if(S.dungeon?.zone!=='sealed'&&S.dungeon?.respawns?.[18]){S.dungeon.respawns[9]=S.dungeon.respawns[18];delete S.dungeon.respawns[18]}if(S.townVisited===undefined)S.townVisited=true;const h=S.party.find(p=>p.id==='hero'),w=S.party.find(p=>p.id==='wind');if(h&&h.healLv===undefined){h.healLv=1;h.healUse=0}if(w&&w.windLv>1&&S.battles===0)w.windLv=1;if(h&&!h.aptitudes)h.aptitudes={fire:1,water:1,wind:1,earth:1};if(w&&!w.aptitudes)w.aptitudes={wind:2};for(const p of S.party){p.row=p.row||(p.id==='hero'?'front':'back');if(!p.stones)p.stones=p.stone?[p.stone]:[];p.stones=p.stones.filter(st=>canEquipStone(p,st));delete p.stone;p.stoneProgress=p.stoneProgress||{};p.learnedStones=(p.learnedStones||[]).filter(st=>!stoneDefs[st]||canEquipStone(p,st));if(p.def===undefined)p.def=p.id==='hero'?7:5;p.statUse=p.statUse||{atk:0,def:0,mag:0};p.statNeed=p.statNeed||{atk:rollNeed(),def:rollNeed(),mag:rollNeed()}}if(!S.vitalAt||S.vitalAt<=S.battles)S.vitalAt=S.battles+rollNeed()}
  function mapScreen(){normalizeState();if(S.flags.chapterComplete&&!S.flags.gateKey){S.flags.chapterComplete=false;S.flags.echoCore=true;S.flags.echoReported=false;S.objective='門の残響核を王城の司書へ届ける'}S.screen='map';const third=S.flags.echoReported&&!S.flags.gateKey,sealed=S.flags.fragmentReported&&!S.flags.echoCore;const target=third?'corridor':sealed?'sealed':'village',label=third?'忘却回廊':sealed?'王都地下・封鎖区画':'フェリアの森';app.innerHTML=`<section class="screen"><header class="topbar"><div class="place"><small>WORLD MAP</small><h2>${esc(S.location)}</h2></div><button class="iconbtn" data-act="menu" aria-label="メニュー">☰</button></header><div class="objective"><b>現在の目的</b><br>${esc(S.objective)}</div><div class="map" aria-label="ワールドマップ"><div class="route r1"></div><div class="route r2"></div><button class="node n1 ${S.flags.gateFragment||S.flags.echoCore||S.flags.gateKey?'active':''}" data-node="town"><span class="mark">⌂</span><span>王都城下町</span></button><button class="node n2 ${!S.flags.gateFragment?'active':''}" data-node="dungeon"><span class="mark">▦</span><span>古い水路</span></button><button class="node n3 ${third||sealed?'active':'locked'}" data-node="${target}" ${third||sealed?'':'disabled'}><span class="mark">${third?'廊':sealed?'封':'✦'}</span><span>${label}</span></button></div>${partyStrip()}</section>`}
  function townScreen(){normalizeState();S.screen='town';if(!S.townVisited){S.townVisited=true;S.objective='古い水路で「門」の手掛かりを探す';save(0)}const weapon=(name,price,desc)=>`<div class="card shopitem"><div><b>${name}　所持${S.weapons[name]}本</b><small>${desc}</small></div><button class="btn gold" data-buyweapon="${name}" data-price="${price}">${price} G</button></div>`;let report='';if(S.flags.gateFragment&&!S.flags.fragmentReported)report=`<div class="card"><b>王城からの呼び出し</b><p class="muted">水路で拾った「門」の欠片を、王城の司書が調べたがっています。</p><button class="btn primary" data-act="reportfragment">門の欠片を城へ届ける</button></div>`;if(S.flags.echoCore&&!S.flags.echoReported)report=`<div class="card"><b>封鎖区画からの帰還</b><p class="muted">門の残響核を司書へ届け、地下で起きたことを報告します。</p><button class="btn primary" data-act="reportfragment">残響核を城へ届ける</button></div>`;if(S.flags.gateKey&&!S.flags.chapterComplete)report=`<div class="card"><b>忘却回廊からの帰還</b><p class="muted">門喰らいが守っていた「帰路の鍵」を司書へ届けます。</p><button class="btn primary" data-act="reportfragment">帰路の鍵を城へ届ける</button></div>`;app.innerHTML=`<section class="screen"><header class="topbar"><div class="place"><small>CASTLE TOWN</small><h2>王都城下町</h2></div><div><button class="iconbtn" data-act="menu" aria-label="メニュー">☰</button> <button class="iconbtn" data-act="map">地図</button></div></header><div class="objective"><b>王国からの支給品</b><br>弱い剣、見習い杖、烈風刃・ヘイスト・プロテクトの魔石</div>${report}<div class="card shopitem"><div><b>月灯りの宿</b><small>二人のHPとMPを全回復</small></div><button class="btn gold" data-act="inn">10 G</button></div><div class="shopgrid">${weapon('剣',35,'安定した物理攻撃')}${weapon('杖',35,'物理は弱いがターンごとにMP回復')}${weapon('弓',60,'後衛向け。通常攻撃のHIT数+1')}${weapon('槍',55,'前衛・後衛どちらでも威力が落ちない')}<div class="card shopitem"><div><b>ポーション</b><small>HPを35回復</small></div><button class="btn gold" data-buypotion>15 G</button></div></div><div class="card"><b>所持魔石</b><p class="muted">${Object.entries(S.stones).map(([k,v])=>`${k} ×${v}`).join('　')}</p><p>適性を満たす魔石のみ装備可能。装備中はすぐ使用でき、10戦勝利で恒久習得します。</p></div>${partyStrip()}</section>`}
  function canEquip(p,weapon){return p.weapon===weapon||S.party.filter(x=>x.id!==p.id&&x.weapon===weapon).length<S.weapons[weapon]}
  function equipTargets(weapon){app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalbox"><h2>${weapon}を装備する</h2><div class="target-list">${S.party.map(p=>`<button class="btn" data-equipto="${p.id}" data-weapon="${weapon}" ${canEquip(p,weapon)?'':'disabled'}>${p.name}<small>現在：${p.weapon}</small></button>`).join('')}</div><button class="btn ghost" data-close>戻る</button></div></div>`)}
  function zoneConfig(){if(S.dungeon.zone==='corridor')return{name:'忘却回廊',size:7,walls:[4,9,11,16,18,23,25,30,32,37,39,44],boss:6,chest:48,exit:42,mobs:[7,13,15,20,27,34,38,47],bossType:'devourer'};if(S.dungeon.zone==='sealed')return{name:'王都地下・封鎖区画',size:7,walls:[1,8,10,17,19,22,24,29,31,36,38,45],boss:6,chest:48,exit:42,mobs:[12,15,20,27,33,35,41,47],bossType:'wraith'};return{name:'古い水路',size:7,walls:[2,9,11,21,23,25,30,32,37,39,44],boss:6,chest:48,exit:42,mobs:[8,15,18,20,29,34,38,41],bossType:'armor'}}
  function refreshEnemies(){S.dungeon.respawns=S.dungeon.respawns||{};const now=Date.now(),z=zoneConfig();for(const spot of z.mobs){if(!S.dungeon.enemies.includes(spot)&&S.dungeon.respawns[spot]&&now-S.dungeon.respawns[spot]>=60000){S.dungeon.enemies.push(spot);delete S.dungeon.respawns[spot]}}}
  function dungeonScreen(){S.screen='dungeon';refreshEnemies();const pos=S.dungeon.pos,z=zoneConfig();let tiles='';for(let i=0;i<z.size*z.size;i++){let c=z.walls.includes(i)?'tile wall':'tile path';if(!z.walls.includes(i)){if(i===pos)c+=' player';else if(S.dungeon.enemies.includes(i))c+=i===z.boss?' boss':' enemy';else if(i===z.chest&&S.dungeon.chest)c+=' chest';else if(i===z.exit)c+=' exit'}tiles+=`<div class="${c}" data-tile="${i}"></div>`}app.innerHTML=`<section class="screen dungeon zone-${S.dungeon.zone||'waterway'}"><header class="topbar"><div class="place"><small>DUNGEON · 7×7</small><h2>${z.name}</h2></div><div><button class="iconbtn" data-act="menu" aria-label="メニュー">☰</button> <button class="iconbtn" data-act="map" aria-label="地図へ">地図</button></div></header><div class="objective"><b>探索</b>　通常敵8体＋ボス。◆は宝箱、赤い♜は区画ボス。通常敵は約60秒で戻る。</div><div class="room">${tiles}</div><div class="dpad"><button class="btn" data-dir="up">▲</button><button class="btn" data-dir="left">◀</button><button class="btn" data-dir="down">▼</button><button class="btn" data-dir="right">▶</button></div>${partyStrip()}</section>`}
  function move(dir){const from=S.dungeon.pos,z=zoneConfig(),row=Math.floor(from/z.size),col=from%z.size;let to=from;if(dir==='up'&&row>0)to-=z.size;if(dir==='down'&&row<z.size-1)to+=z.size;if(dir==='left'&&col>0)to--;if(dir==='right'&&col<z.size-1)to++;if(to===from||z.walls.includes(to))return;S.dungeon.pos=to;if(to===z.exit){S.location='王都郊外';autosave();mapScreen();return}if(to===z.chest&&S.dungeon.chest){S.dungeon.chest=false;if(S.dungeon.zone==='corridor'){S.weapons['弓']=(S.weapons['弓']||0)+1;showToast('宝箱から「風切りの弓」を入手')}else{S.potions+=S.dungeon.zone==='sealed'?2:1;showToast(S.dungeon.zone==='sealed'?'上等なポーションを2個入手':'水の魔石とポーションを入手');S.party[0].healLv=1}save(0)}if(S.dungeon.enemies.includes(to)){S.dungeon.enemies=S.dungeon.enemies.filter(x=>x!==to);S.dungeon.respawns=S.dungeon.respawns||{};S.dungeon.respawns[to]=Date.now();startBattle(to===z.boss?z.bossType:(S.dungeon.zone==='sealed'?'shade':'slime'));return}dungeonScreen()}
  const enemyDefs={slime:{name:'苔スライム',icon:'◉',hp:38,atk:8,def:2,spd:5,weak:'fire',gold:12},armor:{name:'古びた守衛鎧',icon:'♜',hp:72,atk:12,def:10,spd:4,weak:'fire',gold:28,boss:true},shade:{name:'門影の獣',icon:'●',hp:58,atk:13,def:5,spd:9,weak:'wind',gold:18},wraith:{name:'門の残響',icon:'♜',hp:128,atk:17,def:8,spd:10,weak:'wind',gold:55,boss:true,midBoss:true},devourer:{name:'門喰らい',icon:'♜',hp:184,atk:21,def:11,spd:8,weak:'wind',gold:90,boss:true,finalBoss:true}};
  function startBattle(type){const d=enemyDefs[type];battle={type,enemy:{...d,maxHp:d.hp},turn:1,actor:0,queue:[],log:[`<b>${d.name}</b>が立ちはだかった！`],snapshot:JSON.parse(JSON.stringify(S))};S.screen='battle';renderBattle()}
  function allyCard(p,i){return `<div class="ally ${battle.actor===i?'active':''}"><div><b>${esc(p.name)}</b> <small>${esc(p.role)}・${p.row==='front'?'前衛':'後衛'}</small><div class="hp-line"><span>HP ${p.hp}/${p.maxHp}</span><span>MP ${p.mp}/${p.maxMp}</span></div></div><div class="stats"><div class="bar"><i style="width:${100*p.hp/p.maxHp}%"></i></div><div class="bar mp"><i style="width:${100*p.mp/p.maxMp}%"></i></div></div></div>`}
  function renderBattle(){const e=battle.enemy,actor=S.party[battle.actor];app.innerHTML=`<section class="screen battle"><header class="topbar"><div class="place"><small>BATTLE · TURN ${battle.turn}</small><h2>${zoneConfig().name}</h2></div><button class="iconbtn" data-act="battleinfo">?</button></header><div class="enemy-stage"><div class="enemy-card ${e.hp<=0?'defeated':''}" id="enemy"><div class="enemy-art">${e.icon}</div><div class="enemy-name">${e.name}</div><div class="enemy-hp"><i style="width:${100*max(0,e.hp)/e.maxHp}%"></i></div><small>${max(0,e.hp)} / ${e.maxHp}</small></div></div><div class="battle-log">${battle.log.slice(-3).join('<br>')}</div><div class="combatants">${S.party.map(allyCard).join('')}</div>${actor&&actor.hp>0?commands(actor):'<button class="btn" data-act="advance">次へ</button>'}</section>`}
  function commands(p){return `<div class="commands"><button class="btn" data-cmd="attack">たたかう</button><button class="btn" data-cmd="magic">まほう</button><button class="btn" data-cmd="guard">ぼうぎょ</button><button class="btn" data-cmd="run" ${battle.enemy.boss?'disabled':''}>にげる</button><button class="btn" data-cmd="item" ${S.potions?'':'disabled'}>アイテム</button><button class="btn" data-cmd="status">熟練度</button></div><div class="skill-note">${esc(p.name)}の行動を選択</div>`}
  function choose(cmd,data){const p=S.party[battle.actor];if(cmd==='attack'){battle.queue.push({who:p.id,type:'attack'});useSkill(p,'weapon');p.statUse.atk++}if(cmd==='guard'){battle.queue.push({who:p.id,type:'guard'});p.statUse.def++}if(cmd==='item'){battle.queue.push({who:p.id,type:'item',target:p.id})}if(cmd==='run'){S=battle.snapshot;S.dungeon.enemies=S.dungeon.enemies.filter(x=>x!==S.dungeon.pos);showToast('戦闘から離脱した');dungeonScreen();return}if(cmd==='fire'){battle.queue.push({who:p.id,type:'fire'});p.mp-=2;useSkill(p,'fire');p.statUse.mag++}if(cmd==='wind'){battle.queue.push({who:p.id,type:'wind'});p.mp-=2;useSkill(p,'wind');p.statUse.mag++}if(cmd==='gale'){battle.queue.push({who:p.id,type:'gale'});p.mp-=7;p.galeLv=p.galeLv||1;useSkill(p,'gale');p.statUse.mag++}if(cmd==='haste'){battle.queue.push({who:p.id,type:'haste',target:data||p.id});p.mp-=3;p.statUse.mag++}if(cmd==='protect'){battle.queue.push({who:p.id,type:'protect',target:data||p.id});p.mp-=3;p.statUse.mag++}if(cmd==='heal'){battle.queue.push({who:p.id,type:'heal',target:data||p.id});p.mp-=2;useSkill(p,'heal');p.statUse.mag++}battle.actor++;while(battle.actor<S.party.length&&S.party[battle.actor].hp<=0)battle.actor++;if(battle.actor>=S.party.length)resolveTurn();else renderBattle()}
  function useSkill(p,k){const use=k+'Use';p[use]=(p[use]||0)+1}
  function applyProficiencyGains(){const gains=[];for(const p of S.party){for(const k of ['weapon','fire','wind','gale','heal']){const use=k+'Use',lv=k+'Lv';if(p[lv]===undefined)continue;let need=Math.min(6,2+Math.floor((p[lv]||1)/3));while((p[use]||0)>=need&&(p.id==='hero'||p[lv]<12)){p[use]-=need;p[lv]++;gains.push(`${p.name}　${k==='weapon'?p.weapon:k==='fire'?'ファイアボール':k==='wind'?'風の矢':k==='gale'?'烈風刃':p.id==='heal'?'ヒールライト':'癒しの水'} Lv${p[lv]}`);need=Math.min(6,2+Math.floor((p[lv]||1)/3))}}}return gains}
  function applyStatGains(){const notes=[],vital=S.battles>=S.vitalAt;for(const p of S.party){for(const [key,label] of [['atk','攻撃'],['def','防御'],['mag','魔力']]){if(p.statUse[key]>=p.statNeed[key]){p.statUse[key]=0;p.statNeed[key]=rollNeed();p[key]++;notes.push(`${p.name}　${label}+1`)}}if(vital){p.spd++;p.maxHp+=4;p.maxMp+=2;p.hp+=4;p.mp+=2;notes.push(`${p.name}　素早さ+1／最大HP+4／最大MP+2`)}}if(vital)S.vitalAt=S.battles+rollNeed();return notes}
  function advanceStones(){const notes=[];for(const p of S.party){for(const stone of [...p.stones]){p.stoneProgress[stone]=(p.stoneProgress[stone]||0)+1;if(p.stoneProgress[stone]>=10){if(!p.learnedStones.includes(stone))p.learnedStones.push(stone);p.stones=p.stones.filter(x=>x!==stone);notes.push(`${p.name}が「${stone}」を恒久習得！`)}}}return notes}
