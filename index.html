<body><main id="app" aria-live="polite"></main>
<script>
(() => {
  const app=document.querySelector('#app');
  const KEY='isekai-prototype-save-v1';
  const max=(a,b)=>Math.max(a,b), clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rollNeed=()=>3+Math.floor(Math.random()*5);
  const baseState=()=>({name:'ワッツ',screen:'map',chapter:1,location:'王都城下町',objective:'城下町で旅支度を整え、古い水路へ向かう',unlocked:2,gold:100,potions:3,ethers:1,battles:0,vitalAt:rollNeed(),townVisited:false,healJoined:false,weapons:{'剣':1,'杖':1,'弓':0,'槍':0},weaponNames:{'剣':['訓練用の剣'],'杖':['見習いの杖'],'弓':[],'槍':[]},stones:{'烈風刃':1,'ヘイスト':1,'プロテクト':1},dungeon:{zone:'waterway',pos:42,enemies:[8,15,18,20,29,34,38,41,6],respawns:{},chest:true,boss:false,layoutVersion:2},party:[
    {id:'hero',name:'ワッツ',role:'軽装剣士',hp:64,maxHp:64,mp:18,maxMp:18,atk:10,def:7,mag:7,spd:8,statUse:{atk:0,def:0,mag:0},statNeed:{atk:rollNeed(),def:rollNeed(),mag:rollNeed()},weapon:'剣',weaponName:'訓練用の剣',weaponLv:1,weaponUse:0,fireLv:1,fireUse:0,healLv:1,healUse:0,row:'front',stones:[],aptitudes:{fire:1,water:1,wind:1,earth:1,light:1,dark:1},guard:false},
    {id:'wind',name:'セリア',role:'風使い',hp:48,maxHp:48,mp:28,maxMp:28,atk:6,def:5,mag:12,spd:12,statUse:{atk:0,def:0,mag:0},statNeed:{atk:rollNeed(),def:rollNeed(),mag:rollNeed()},weapon:'杖',weaponName:'見習いの杖',weaponLv:1,weaponUse:0,windLv:1,windUse:0,row:'back',stones:[],aptitudes:{wind:3},guard:false}
  ],flags:{lv13:false,tutorial:false}});
  let S=null, battle=null, modal=null, toastTimer=null;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const saves=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[null,null,null]}catch{return [null,null,null]}};
  function save(slot=0){const all=saves();all[slot]={state:S,at:Date.now()};localStorage.setItem(KEY,JSON.stringify(all));}
  function autosave(){if(S){save(0);showToast('オートセーブしました')}}
  function showToast(msg){clearTimeout(toastTimer);const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;app.append(t);toastTimer=setTimeout(()=>t.remove(),2800)}
  function title(){modal=null;app.innerHTML=`<section class="screen title-screen"><div class="sigil"><span>◆</span></div><div class="eyebrow">COMMAND RPG PROTOTYPE</div><div class="title-copy"><h1>異世界召喚されたけど<br>勇者パーティには<br>選ばれませんでした</h1><p>帰る方法は、自分たちで探す。<br>使った剣と魔法だけが強くなる、小さな旅。</p></div><div class="menu"><button class="btn primary" data-act="new">はじめから</button><button class="btn" data-act="continue" ${saves()[0]?'':'disabled'}>つづきから</button><button class="btn ghost" data-act="slots">セーブデータ</button></div><div class="title-foot"><span>タップ／マウス対応</span><span>PROLOGUE BUILD</span></div></section>`;}
  function newSetup(){app.innerHTML=`<section class="screen setup"><button class="iconbtn" data-act="title" aria-label="戻る">←</button><div class="eyebrow">PLAYER NAME</div><h1>主人公の名前</h1><p class="muted">物語の主人公の名前を決めてください。</p><div class="field"><label for="heroName">主人公の名前</label><input id="heroName" maxlength="8" value="ワッツ" autocomplete="off"></div><button class="btn primary" data-act="start">旅を始める</button></section>`;setTimeout(()=>document.querySelector('#heroName')?.focus(),100)}
  function prologueScenes(){return [
    {place:'現代日本・コンセプトカフェ',who:'店長',face:'manager',text:'おーい魔王さま、勇者ちゃん。写真待ちのお客さん詰まっとるで。世界征服は休憩後にしてやー。'},
    {place:'ハロウィンイベント',who:S.name,face:'hero',text:'俺はバイトです。世界征服は業務に入ってません。'},
    {place:'ハロウィンイベント',who:'セリア',face:'wind',text:'じゃあ私は勇者だけど、魔王を倒さずドリンク運んでくるね。平和でいいでしょ。'},
    {place:'店内',who:'店長',face:'manager',text:'その温度差、うちの名物にできそうやな。ほな二人とも、ラスト一時間よろしく！'},
    {place:'店内の奥',who:'語り',face:'narrator',text:'眼鏡の会社員は剣士衣装の袖を直し、ヴァンパイア姿のギャルは派手な髪で強面の神官へ自撮りを頼んでいる。彼は怖そうな雰囲気に反して、驚くほど丁寧にスマホを構えた。'},
    {place:'カフェカウンター',who:'語り',face:'narrator',text:'その近くでは、魔術師姿の客、軽戦士姿の客、槍兵姿の客もイベントを楽しんでいた。まだ、この九人が同じ場所へ召喚されるとは誰も知らない。'},
    {place:'店内の奥',who:'ヴァンパイアギャル',face:'vampire',text:'神官さん、盛れる角度でお願い！　あ、メガネ剣士も入る？'},
    {place:'店内の奥',who:'眼鏡の会社員',face:'salary',text:'私は結構です。……それより、床の模様。さっきから光っていませんか。'},
    {place:'異変',who:'強面の神官',face:'healer',text:'皆さん、足元から離れてください。店長さん、ブレーカーを——'},
    {place:'召喚の光',who:'語り',face:'narrator',tone:'summon',text:'言葉が終わるより早く、青白い光が店内を飲み込んだ。音も重さも消え、次の瞬間、石造りの広間へ叩き出される。'},
    {place:'異世界・王城',who:'王国の鑑定士',face:'narrator',tone:'castle',text:'召喚に巻き込まれた皆さまへ、まずお詫びを。魔王討伐に適する力を持つ方には、帰還研究への全面協力を約束します。'},
    {place:'鑑定の間',who:'王国の鑑定士',face:'narrator',tone:'castle',text:'この世界では、武器も魔法も熟練度は十二で成長の限界を迎えるとされています。だからこそ、限界の外にある固有能力やレアスキルを持つ者ほど、勇者パーティに選ばれやすいのです。'},
    {place:'鑑定の間',who:'王国の鑑定士',face:'narrator',tone:'castle',text:`${S.name}殿……剣の素質は初級。魔法も火・水・風・土、いずれも初級のみ。奥に靄がありますが、討伐隊への選抜は難しいでしょう。`},
    {place:'鑑定の間',who:'王国の鑑定士',face:'narrator',tone:'castle',text:'こちらは水の中級魔法、次の方は剣術中級、最後の方は槍術中級。優秀ではありますが、討伐隊の少数精鋭枠には届きません。三名とも今回は選外となります。'},
    {place:'鑑定の間',who:'語り',face:'narrator',tone:'castle',text:'究極剣技の会社員、三属性のギャル、光の上級適性を持つ強面の男。そして格闘術上級に加え、固有格闘スキルを持つ店長。四人は王国公認の勇者パーティに選ばれた。'},
    {place:'王城・謁見の間',who:'第一王女リゼット',face:'princess',tone:'princess',text:'勇者に選ばれなかった方々は、わたくしの護衛にします。ちょうど身軽に動ける使い走りが欲しかったの。断る権利？　帰還研究の費用を王家が出すのですから、ありませんわ。'},
    {place:'王城・謁見の間',who:'セリア',face:'wind',tone:'princess',text:'護衛兼、使い走り。勇者より仕事内容が分かりやすいかも。……で、最初のお使いは？'},
    {place:'王城・謁見の間',who:'第一王女リゼット',face:'princess',tone:'princess',text:'古い水路に落とした月雫のブローチを取ってきて。暗くて汚くて、わたくしが入る場所ではありませんもの。あなたたちの帰還の手掛かり探しも、仕事を済ませてからなら許しますわ。'},
    {place:'王城・支給所',who:'王国の係官',face:'narrator',tone:'castle',text:'旅の支度として、「訓練用の剣」と「見習いの杖」を支給します。魔石は「烈風刃」「ヘイスト」「プロテクト」を一つずつ。ファイアボールと「癒しの水」は、すでに使えるようですね。'},
    {place:'王城・支給所',who:'王国の係官',face:'narrator',tone:'castle',text:'魔石の魔法は、持っているだけでは修得できません。適性の合う者が装備して戦い、魔石と力を馴染ませる必要があります。装備中なら修得前でも使用できます。'},
    {place:'王城・廊下',who:'眼鏡の会社員',face:'salary',tone:'castle',text:`${S.name}さん。これは今ある情報だけでの判断です。私たちは魔王を追います。あなたは、帰る道を探してください。見つけた情報は必ず共有します。`},
    {place:'王城・廊下',who:'セリア',face:'wind',tone:'castle',text:'私も選外。風は上級だけど、向こうに三属性の上位互換がいるからね。……姫の護衛をしながら、二人で帰り道を探そうか。'},
    {place:'旅立ち',who:S.name,face:'hero',tone:'castle',text:'勇者じゃなくて、姫の護衛兼使い走りか。まあ、水路に帰る手掛かりがあるかもしれない。まずはブローチを回収しよう。'}
  ]}
  function prologueScreen(){S.screen='prologue';S.prologue=S.prologue||0;save(0);const scenes=prologueScenes(),x=scenes[S.prologue]||scenes[0];app.innerHTML=`<section class="screen story-screen"><div class="story-art ${x.tone||''}"><div class="story-top"><span>PROLOGUE · ${esc(x.place)}</span><button class="btn ghost skip" data-act="skipprologue">スキップ</button></div></div><div class="dialogue"><div class="speaker"><div class="portrait ${x.face}"></div><span>${esc(x.who)}</span></div><p>${esc(x.text)}</p><button class="btn primary next" data-act="nextstory">${S.prologue===scenes.length-1?'城下町へ':'次へ'}</button></div></section>`}
  function finishPrologue(){delete S.prologue;S.screen='town';S.objective='姫の月雫のブローチを探すため、古い水路へ向かう';save(0);townScreen();showToast('王女付き護衛の任務を開始した')}
  function partyStrip(){return `<div class="party-strip">${S.party.map(p=>`<div class="mini"><b>${esc(p.name)}</b><div class="bar"><i style="width:${100*p.hp/p.maxHp}%"></i></div><span>HP ${p.hp}/${p.maxHp}</span></div>`).join('')}<div class="mini"><b>所持金</b><span>${S.gold} G</span><br><span>薬 ${S.potions}</span></div></div>`}
  const stoneDefs={'烈風刃':{element:'wind',tier:2,label:'風・中級攻撃'},'光槍':{element:'light',tier:2,label:'光・中級攻撃'},'天光穿':{element:'light',tier:3,label:'光・上級単体攻撃'},'風刃付与':{element:'wind',tier:3,label:'風・上級全体斬撃付与'},'聖天輪':{element:'light',tier:3,label:'光・上級全体攻撃'},'風幻':{element:'wind',tier:2,label:'風・中級物理回避'},'風分身':{element:'wind',tier:2,label:'風・中級行動複製'},'光障壁':{element:'light',tier:2,label:'光・中級魔法防御'},'ヘイスト':{element:'wind',tier:1,label:'風・初級'},'プロテクト':{element:'earth',tier:1,label:'土・初級'}};
  const weaponShopNames={'剣':'鉄の剣','杖':'樫の杖','弓':'狩人の弓','槍':'兵士の槍'};
  const weaponStats={'訓練用の剣':{atk:1},'鉄の剣':{atk:3},'見習いの杖':{mag:1},'樫の杖':{atk:1,mag:2},'狩人の弓':{atk:2},'兵士の槍':{atk:2},'星痕の杖':{atk:1,mag:5},'翠風の槍':{atk:5},'風切りの弓':{atk:4},'フェリアの光杖':{mag:4}};
  const weaponEffect=p=>weaponStats[p.weaponName]||{atk:0,mag:0};
  const chooseEnemy=cmd=>app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalbox"><h2>攻撃する敵</h2><div class="target-list">${battle.enemies.filter(e=>e.hp>0).map(e=>`<button class="btn" data-enemytarget="${e.id}" data-enemycmd="${cmd}">${esc(e.name)}<small>HP ${e.hp}/${e.maxHp}</small></button>`).join('')}</div><button class="btn ghost" data-close>戻る</button></div></div>`);
  function canEquipStone(p,stone){const d=stoneDefs[stone];return !!d&&(p.aptitudes?.[d.element]||0)>=d.tier}

  function villageScreen(){S.screen='village';S.location='フェリアの村';const done=S.flags.chapter2Relic,joined=S.flags.thirdJoined;app.innerHTML=`<section class="screen result"><div class="eyebrow">CHAPTER II · FERIA VILLAGE</div><h1>フェリアの村</h1><img class="village-character" src="assets/mireia-feria-v1.png" alt="二対の半透明の羽を持つフェリア族の光術師シルク">${done?`<div class="card"><b>第一王女リゼット</b><p class="muted">「二つの遺跡まで鎮めるなんて、わたくしの見立てどおりですわ。村への支援も約束どおり続けます」</p></div><div class="card"><b>シルク</b><p class="muted">「召喚痕はまだ先へ続いています。でも今は、無事に帰れたことを喜びましょう」</p></div><button class="btn gold" data-act="finishchapter2">第二章を終える</button>`:joined?`<div class="card"><b>シルク</b><p class="muted">「まずは風渡りの洞窟です。あそこを抜けなければ、召喚痕の祠へは行けません」</p></div><div class="card"><b>第一王女リゼット</b><p class="muted">「王家の通行証と旅費、それに村へ薬と交易路の整備を。シルク、これは命令ではなく取引です。二人の帰還の旅を手伝い、見聞を村へ持ち帰ってちょうだい」</p></div><button class="btn primary" data-act="map">地図へ戻る</button>`:`<div class="card"><b>第一王女リゼット</b><p class="muted">「本当に羽がありますのね！　……触りませんわよ、その顔は何ですの」</p></div><div class="card"><b>フェリア村長</b><p class="muted">「シルクは古い召喚痕までの道を知っています。ですが、村の大切な光術師を危険な旅へ出すわけには」</p></div><div class="card"><b>第一王女リゼット</b><p class="muted">「では取引です。王家が薬と冬支度を届け、街道の交易を保証します。代わりに、シルクがこの二人の帰還の旅へ同行することを認めてください」</p></div><div class="card"><b>シルク</b><p class="muted">「私も召喚痕の先が気になります。長老、行かせてください。必ず村へ帰って、見たものを伝えます」</p></div><div class="card"><b>フェリア村長</b><p class="muted">「本人の意志と王女殿下の約束があるなら。シルク、二人を支え、無事に戻りなさい」</p></div><button class="btn gold" data-act="recruitlocal">シルクと旅に出る</button>`}</section>`}

    if(usable.has('サイクロン')){const cost=p.id==='wind'&&S.flags.celiaWindBracelet?8:15;list.insertAdjacentHTML('beforeend',`<button class="btn spell" data-spell="cyclone" ${p.mp>=cost?'':'disabled'}><span>サイクロン<small>風・上級・MP${cost}・敵全体攻撃・Lv${p.cycloneLv||1}</small></span><span>›</span></button>`)}
  };
  function finishExpandedMagicChoice(){battle.actor++;while(battle.actor<S.party.length&&S.party[battle.actor].hp<=0)battle.actor++;if(battle.actor>=S.party.length)resolveTurn();else renderBattle()}
  const chooseBeforeExpandedSecretMagic=choose;
  choose=function(cmd,data){
    if(!['heallight','lifedrain','cyclone'].includes(cmd))return chooseBeforeExpandedSecretMagic(cmd,data);
    if(!battle||battle.resolving)return;const p=S.party[battle.actor];
    if(cmd==='heallight'&&data===undefined){app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalbox"><h2>ヒールライトの対象</h2><div class="target-list">${S.party.map(q=>`<button class="btn" data-heallighttarget="${q.id}" ${q.hp<=0?'disabled':''}>${q.name}<small>HP ${q.hp}/${q.maxHp}</small></button>`).join('')}</div><button class="btn ghost" data-close>戻る</button></div></div>`);return}
    if(cmd==='lifedrain'&&data===undefined){const live=battle.enemies.filter(e=>e.hp>0);if(live.length>1&&new Set(live.map(e=>e.kind)).size>1){chooseEnemy('lifedrain');return}data=[...live].sort((a,b)=>a.hp-b.hp)[0]?.id}
    if(cmd==='heallight'){const effect=weaponStats[p.weaponName]||{},cost=effect.lightHalfCost?1:2,n=Math.floor((16+3*(p.healLightLv||1)+p.mag+(weaponEffect(p).mag||0))*(effect.lightBoost||1));if(p.mp<cost)return;const q=S.party.find(x=>x.id===data);if(!q)return;p.mp-=cost;useSkill(p,'healLight');p.statUse.mag++;battle.queue.push({who:p.id,type:'heallight',target:q.id});finishExpandedMagicChoice();return}
    if(cmd==='lifedrain'){if(p.mp<3)return;p.mp-=3;useSkill(p,'drain');p.statUse.mag++;battle.queue.push({who:p.id,type:'lifedrain',target:data});finishExpandedMagicChoice();return}
    const cost=p.id==='wind'&&S.flags.celiaWindBracelet?8:15;if(p.mp<cost)return;p.mp-=cost;useSkill(p,'cyclone');p.statUse.mag++;battle.queue.push({who:p.id,type:'cyclone'});finishExpandedMagicChoice()
  };
  const magicFieldMenuBeforeExpandedSecretMagic=magicFieldMenu;
  magicFieldMenu=function(){
    magicFieldMenuBeforeExpandedSecretMagic();const box=document.querySelector('.modalbox');if(!box)return;
    for(const p of S.party){const usable=new Set([...(p.stones||[]),...(p.learnedStones||[])]);if(!usable.has('ヒールライト'))continue;const cost=(weaponStats[p.weaponName]||{}).lightHalfCost?1:2;box.querySelector('.target-list')?.insertAdjacentHTML('beforeend',`<button class="btn" data-fieldheallight="${p.id}" ${p.mp<cost?'disabled':''}>${p.name}のヒールライト</button>`)}
  };
  app.addEventListener('click',e=>{const target=e.target.closest('button[data-heallighttarget]'),field=e.target.closest('button[data-fieldheallight]');if(target){e.stopImmediatePropagation();document.querySelector('.modal')?.remove();choose('heallight',target.dataset.heallighttarget);return}if(field){e.stopImmediatePropagation();const p=S.party.find(x=>x.id===field.dataset.fieldheallight),effect=weaponStats[p?.weaponName]||{},cost=effect.lightHalfCost?1:2;if(!p||p.mp<cost)return;const living=S.party.filter(x=>x.hp>0);app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalbox"><h2>${p.name}のヒールライト</h2><div class="target-list">${living.map(q=>`<button class="btn" data-fieldheallighttarget="${q.id}" data-caster="${p.id}">${q.name}<small>HP ${q.hp}/${q.maxHp}</small></button>`).join('')}</div><button class="btn ghost" data-close>戻る</button></div></div>`);return}const ft=e.target.closest('button[data-fieldheallighttarget]');if(ft){e.stopImmediatePropagation();const p=S.party.find(x=>x.id===ft.dataset.caster),q=S.party.find(x=>x.id===ft.dataset.fieldheallighttarget),effect=weaponStats[p?.weaponName]||{},cost=effect.lightHalfCost?1:2;if(!p||!q||p.mp<cost)return;const n=Math.floor((16+3*(p.healLightLv||1)+p.mag+(weaponEffect(p).mag||0))*(effect.lightBoost||1));p.mp-=cost;useSkill(p,'healLight');p.statUse.mag++;q.hp=Math.min(q.maxHp,q.hp+n);save(0);document.querySelector('.modal')?.remove();showToast(`${q.name}のHPを${n}回復した`) }},true);
  const applyProficiencyBeforeExpandedSecretMagic=applyProficiencyGains;
  applyProficiencyGains=function(){const gains=applyProficiencyBeforeExpandedSecretMagic(),labels={healLight:'ヒールライト',drain:'ライフドレイン',cyclone:'サイクロン'};for(const p of S.party)for(const [key,label] of Object.entries(labels)){if(p[key+'Lv']===undefined)continue;let need=masteryNeed(p,p[key+'Lv']);const cap=S.flags.dragonTrialReward&&p.id!=='hero'?24:12;while((p[key+'Use']||0)>=need&&(p.id==='hero'||p[key+'Lv']<cap)){p[key+'Use']-=need;p[key+'Lv']++;gains.push(`${p.name}　${label} Lv${p[key+'Lv']}`);need=masteryNeed(p,p[key+'Lv'])}}return gains};
  const applyMetalTrainingBeforeExpandedSecretMagic=applyMetalTrainingBonus;
  applyMetalTrainingBonus=function(multiplier){applyMetalTrainingBeforeExpandedSecretMagic(multiplier);for(const p of S.party){const before=battle.snapshot.party.find(x=>x.id===p.id);if(!before)continue;for(const key of ['healLight','drain','cyclone']){const use=key+'Use',delta=Math.max(0,(p[use]||0)-(before[use]||0));p[use]=(p[use]||0)+delta*(multiplier-1)}}};
  title();registerWebMCP();
})();
</script></body></html>
